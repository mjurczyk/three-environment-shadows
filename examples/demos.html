<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-environment-shadows · VDB-147 demos</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.23;
        background-color: #000000;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }

      #analysis {
        position: absolute;
        top: 8px;
        left: 8px;
        max-width: calc(100vw - 280px);
        padding: 6px 8px;
        font-size: 13px;
        color: #ffffff;
        background-color: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        z-index: 1;
      }

      #stats {
        position: absolute;
        left: 8px;
        bottom: 40px;
        margin: 0;
        padding: 6px 8px;
        font-size: 12px;
        color: #ffffff;
        background-color: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        z-index: 1;
        pointer-events: none;
      }

      #analysis:empty {
        display: none;
      }

      .bottom-tab {
        position: absolute;
        display: inline-flex;
        bottom: 0px;
        left: 0px;
        width: calc(100vw - 8px);
        padding: 6px 4px 2px 4px;
        font-size: 14px;
        color: #ffffff;
        background-color: #1f1f1f;
        z-index: 3;
        border-top: solid 1px #3f3f3f;
      }

      .bottom-tab a {
        color: #ffffff;
        text-decoration: none;
        opacity: 0.8;
      }

      .bottom-tab a:hover {
        opacity: 1;
      }

      .bottom-tab > * {
        margin: 0px 8px;
      }
    </style>
  </head>
  <body>
    <div id="analysis"></div>
    <pre id="stats"></pre>
    <div class="bottom-tab">
      <div>
        <a href="https://github.com/mjurczyk/three-environment-shadows" target="_blank">
          Github mjurczyk/three-environment-shadows
        </a>
      </div>
      <div>
        <a href="https://github.com/mjurczyk/three-environment-shadows#usage" target="_blank">
          Documentation
        </a>
      </div>
      <div class="package-version" style="flex-grow: 1; text-align: right"></div>
    </div>
    <script type="module" src="/src/demos/main.js"></script>
  </body>
</html>
