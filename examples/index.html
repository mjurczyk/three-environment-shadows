<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-environment-shadows</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.23;
        background-color: #000000;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }


      .split-line {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        background-color: #ffffff;
        z-index: 2;
        cursor: ew-resize;
        touch-action: none;
      }

      /* NOTE A wider area to grab the line */
      .split-line::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -8px;
        right: -8px;
      }

      .bottom-tab {
        position: absolute;
        display: inline-flex;
        align-items: center;
        bottom: 0px;
        left: 0px;
        width: calc(100vw - 8px);
        padding: 8px 4px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
        font-size: 14px;
        color: #ffffff;
        background-color: #1f1f1f;
        z-index: 3;
        border-top: solid 1px #3f3f3f;
      }

      .bottom-tab a {
        color: #ffffff;
        text-decoration: none;
        opacity: 0.8;
      }

      .bottom-tab a:hover {
        opacity: 1;
      }

      .bottom-tab img {
        display: block;
      }

      .bottom-tab > * {
        margin: 0px 8px;
        white-space: nowrap;
      }

      /* NOTE The stars badge links to the same repo, so the long text link can go on narrow screens */
      @media (max-width: 600px) {
        .bottom-tab .repo-link {
          display: none;
        }
      }

      .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        font-size: 14px;
        color: #ffffff;
        background-color: rgba(31, 31, 31, 0.85);
        border-radius: 6px;
        z-index: 4;
        pointer-events: none;
      }

      .loader.visible {
        display: flex;
      }

      .loader::before {
        content: '';
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* NOTE ?test=1 (visual tests): only the canvas */
      body.test .lil-gui,
      body.test .bottom-tab,
      body.test .stats {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="split-line"></div>
    <div class="loader visible">Preparing model...</div>
    <div class="bottom-tab">
      <div class="repo-link">
        <a href="https://github.com/mjurczyk/three-environment-shadows" target="_blank">
          Github mjurczyk/three-environment-shadows
        </a>
      </div>
      <div>
        <a href="https://github.com/mjurczyk/three-environment-shadows#usage" target="_blank">
          Documentation
        </a>
      </div>
      <div>
        <a href="https://github.com/mjurczyk/three-environment-shadows" target="_blank">
          <img alt="GitHub Repo stars" src="https://img.shields.io/github/stars/mjurczyk/three-environment-shadows?style=social" />
        </a>
      </div>
      <div class="package-version" style="flex-grow: 1; text-align: right"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
